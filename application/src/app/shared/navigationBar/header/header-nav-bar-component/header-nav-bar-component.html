<header class="topbar">
    <div class="topbar-start">
        <button class="icon-button menu-button" type="button" aria-label="Toggle sidebar" (click)="sidebarToggle.emit()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
        <div class="breadcrumb"><span>Workspace</span><b>/</b><strong>{{ breadcrumb }}</strong></div>
    </div>
    <div class="topbar-actions">
        <label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4 4" /></svg><input type="search" [placeholder]="searchPlaceholder" aria-label="Search" /><kbd>⌘ K</kbd></label>
        @for (action of actions; track action.id) {
            <button class="custom-action" type="button" (click)="actionSelected.emit(action.id)">{{ action.label }}</button>
        }
        <button class="icon-button notification-button" type="button" aria-label="Notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" /></svg><i></i></button>
        <div class="topbar-divider"></div>
        <button class="profile-button" type="button" aria-label="Open profile menu">
            <span class="avatar">{{ accountService.userData()?.username?.charAt(0) || 'U' }}</span>
            <span class="profile-copy">
                <strong>{{ accountService.userData()?.username }}</strong>
                <small>{{ accountService.userData()?.email }}</small>
            </span>
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m7 10 5 5 5-5" />
            </svg>
        </button>
    </div>
</header>
